<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="plagBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141010"/>
      <stop offset="50%" stop-color="#1A1414"/>
      <stop offset="100%" stop-color="#100D0D"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="600" fill="url(#plagBg)"/>
  
  <!-- Outer Card Frame -->
  <rect x="50" y="40" width="900" height="520" rx="8" fill="#171313" stroke="#F1E4D4" stroke-opacity="0.15" stroke-width="1.5"/>
  
  <!-- Header Bar -->
  <rect x="50" y="40" width="900" height="42" rx="8" fill="#211A1A"/>
  <circle cx="80" cy="61" r="5" fill="#8C3038"/>
  <circle cx="100" cy="61" r="5" fill="#D7C4B2" fill-opacity="0.4"/>
  <circle cx="120" cy="61" r="5" fill="#F1E4D4" fill-opacity="0.2"/>
  <text x="150" y="66" font-family="monospace" font-size="12" fill="#D7C4B2" letter-spacing="1">PLAGIARISM &amp; SIMILARITY DETECTION SYSTEM · ENGINE v3.2</text>
  <rect x="740" y="50" width="180" height="22" rx="3" fill="#8C3038" fill-opacity="0.25" stroke="#8C3038" stroke-width="1"/>
  <text x="830" y="65" font-family="monospace" font-size="10" fill="#F1E4D4" font-weight="bold" text-anchor="middle">RENDER: LIVE DEPLOYED</text>

  <!-- URL Bar -->
  <rect x="80" y="100" width="840" height="40" rx="4" fill="#100D0D" stroke="#F1E4D4" stroke-opacity="0.1"/>
  <text x="100" y="125" font-family="monospace" font-size="11" fill="#8E7D70">ENDPOINT:</text>
  <text x="175" y="125" font-family="monospace" font-size="11" fill="#D7C4B2">https://plagiarism-similarity-detector.onrender.com/inspect</text>
  <rect x="825" y="108" width="80" height="24" rx="3" fill="#8C3038"/>
  <text x="865" y="124" font-family="monospace" font-size="10" fill="#F1E4D4" font-weight="bold" text-anchor="middle">RUN SCAN</text>

  <!-- Left: Side-by-Side Ingestion and Token Comparison -->
  <rect x="80" y="155" width="480" height="335" rx="6" fill="#100D0D" stroke="#F1E4D4" stroke-opacity="0.08"/>
  <rect x="80" y="155" width="480" height="34" fill="#1A1414"/>
  <text x="100" y="177" font-family="monospace" font-size="11" fill="#8E7D70">SOURCE TEXT vs REFERENCE DOCUMENT</text>
  
  <g font-family="monospace" font-size="10">
    <rect x="95" y="200" width="450" height="26" rx="3" fill="#8C3038" fill-opacity="0.25" stroke="#8C3038" stroke-width="1"/>
    <text x="105" y="217" fill="#F1E4D4">[MATCH 98%] def tokenize_stream(document_buffer):</text>
    
    <rect x="95" y="235" width="450" height="22" rx="3" fill="#171313"/>
    <text x="105" y="250" fill="#8E7D70">    tokens = re.findall(r"\b\w+\b", document_buffer.lower())</text>
    
    <rect x="95" y="265" width="450" height="26" rx="3" fill="#8C3038" fill-opacity="0.25" stroke="#8C3038" stroke-width="1"/>
    <text x="105" y="282" fill="#F1E4D4">[MATCH 92%] return [t for t in tokens if t not in stop_words]</text>
    
    <rect x="95" y="300" width="450" height="22" rx="3" fill="#171313"/>
    <text x="105" y="315" fill="#8E7D70">def calculate_jaccard_overlap(set_a, set_b):</text>
    
    <rect x="95" y="330" width="450" height="26" rx="3" fill="#8C3038" fill-opacity="0.25" stroke="#8C3038" stroke-width="1"/>
    <text x="105" y="347" fill="#F1E4D4">[MATCH 96%] intersection = len(set_a.intersection(set_b))</text>
    
    <rect x="95" y="365" width="450" height="22" rx="3" fill="#171313"/>
    <text x="105" y="380" fill="#8E7D70">union = len(set_a.union(set_b))</text>
    
    <rect x="95" y="395" width="450" height="26" rx="3" fill="#8C3038" fill-opacity="0.25" stroke="#8C3038" stroke-width="1"/>
    <text x="105" y="412" fill="#F1E4D4">[MATCH 94%] return (intersection / union) if union != 0 else 0.0</text>
    
    <rect x="95" y="430" width="450" height="45" rx="3" fill="#211A1A"/>
    <text x="105" y="450" fill="#D7C4B2">MySQL AUDIT RECORD: SCAN_ID #8942 · 14,280 WORDS PROCESSED</text>
    <text x="105" y="466" fill="#8E7D70">Stored in relational database tables with session timestamps</text>
  </g>

  <!-- Right: Similarity Matrix & Gauges -->
  <rect x="580" y="155" width="340" height="335" rx="6" fill="#1A1414" stroke="#F1E4D4" stroke-opacity="0.1"/>
  
  <text x="750" y="188" font-family="serif" font-size="15" fill="#F1E4D4" font-weight="bold" text-anchor="middle">OVERALL SIMILARITY SCORE</text>
  
  <!-- Big Gauge -->
  <circle cx="750" cy="280" r="65" fill="none" stroke="#261E1E" stroke-width="13"/>
  <circle cx="750" cy="280" r="65" fill="none" stroke="#8C3038" stroke-width="13" stroke-dasharray="410" stroke-dashoffset="68" stroke-linecap="round"/>
  <text x="750" y="278" font-family="serif" font-size="32" fill="#F1E4D4" font-weight="bold" text-anchor="middle">83.4%</text>
  <text x="750" y="298" font-family="monospace" font-size="10" fill="#8C3038" font-weight="bold" text-anchor="middle">HIGH SIMILARITY DETECTED</text>

  <!-- Breakdown stats -->
  <rect x="605" y="365" width="290" height="36" rx="4" fill="#100D0D" stroke="#F1E4D4" stroke-opacity="0.08"/>
  <text x="620" y="388" font-family="monospace" font-size="10" fill="#8E7D70">TOKEN JACCARD OVERLAP:</text>
  <text x="880" y="388" font-family="monospace" font-size="11" fill="#F1E4D4" font-weight="bold" text-anchor="end">86.2%</text>

  <rect x="605" y="410" width="290" height="36" rx="4" fill="#100D0D" stroke="#F1E4D4" stroke-opacity="0.08"/>
  <text x="620" y="433" font-family="monospace" font-size="10" fill="#8E7D70">COSINE VECTOR METRIC:</text>
  <text x="880" y="433" font-family="monospace" font-size="11" fill="#F1E4D4" font-weight="bold" text-anchor="end">81.0%</text>

  <rect x="605" y="455" width="290" height="25" rx="3" fill="#8C3038" fill-opacity="0.2"/>
  <text x="750" y="472" font-family="monospace" font-size="10" fill="#F1E4D4" text-anchor="middle">REPORT GENERATED · AUDIT CONFIRMED</text>

  <text x="70" y="540" font-family="monospace" font-size="11" fill="#8E7D70">SYSTEM: FLASK · PYTHON · MYSQL · AUTHENTICATION · REST API</text>
  <text x="930" y="540" font-family="monospace" font-size="11" fill="#D7C4B2" text-anchor="end">SABITHA SARAVANAN</text>
</svg>